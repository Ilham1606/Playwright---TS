name: Playwright Tests with Allure Reporting

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        project:
          - ui:auth:chrome
          - ui:auth:firefox
          - ui:public
          # - api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup Java (for Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Playwright tests (${{ matrix.project }})
        run: npx playwright test --project="${{ matrix.project }}"
        env:
          CI: true
          ALLURE_RESULTS_DIR: allure-results

          # ===== BASE URL =====
          BASE_URL_CONDUIT: ${{ secrets.BASE_URL_CONDUIT }}
          BASE_URL_DUMMYJSON: ${{ secrets.BASE_URL_DUMMYJSON }}
          BASE_URL_BONDARCONDUIT: ${{ secrets.BASE_URL_BONDARCONDUIT }}

          # ===== CREDENTIALS (.env) =====
          USER_EMAIL: ${{ secrets.TEST_EMAIL_CONDUIT }}
          USER_PASSWORD: ${{ secrets.TEST_PASSWORD_CONDUIT }}

      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results \
            --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.project }}
          path: allure-report
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.xml
          check_name: Test Results - ${{ matrix.project }}
