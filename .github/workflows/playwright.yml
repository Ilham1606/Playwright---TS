name: Playwright Tests with Allure Reporting

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
    branches: [main]

  # optional: kalau masih mau jalan di push ke main
  push:
    branches: [main]

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        browser: [chromium, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup Java (for Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Playwright tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          ALLURE_RESULTS_DIR: allure-results

      # Generate Allure HTML (safe even if tests fail)
      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results \
            --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report
          retention-days: 30

      # - name: Upload JUnit test results
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: junit-results-${{ matrix.browser }}
      #     path: test-results/
      #     retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.xml
          check_name: Test Results - ${{ matrix.browser }}
